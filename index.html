<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Media TraX</title>

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Media TraX" />
  <meta name="theme-color" content="#13151b" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%2313151b'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23246bfd'/%3E%3Cstop offset='50%25' stop-color='%239b6bff'/%3E%3Cstop offset='100%25' stop-color='%23ff5ec4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='195,140 385,256 195,372' fill='url(%23g)'/%3E%3C/svg%3E" />

  <style>
    @property --neon-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      --bg: #13151b;
      --bg-2: #181b23;
      --card: #1f222c;
      --card-hover: #262a36;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #8e95a9;
      --primary: #246bfd;
      --purple: #9b6bff;
      --pink: #ff5ec4;
      --cyan: #22d3ee;
      --green: #22c55e;
      --orange: #f59e0b;
      --danger: #ef4444;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.42), inset 0 -1px 2px rgba(0, 0, 0, 0.38);
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
      --radius-lg: 24px;
      --radius-md: 18px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-theme="light"] {
      --bg: #eef2f9;
      --bg-2: #e4eaf5;
      --card: rgba(255, 255, 255, 0.86);
      --card-hover: #ffffff;
      --border: rgba(15, 23, 42, 0.09);
      --text: #0f172a;
      --muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(15, 23, 42, 0.08);
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)) 16px;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(36, 107, 253, 0.16), transparent 36%),
        radial-gradient(circle at 88% 18%, rgba(155, 107, 255, 0.15), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(255, 94, 196, 0.11), transparent 40%);
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Apple Liquid Glass Primitive */
    .liquid-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight), 0 8px 22px rgba(0, 0, 0, 0.22);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.28s var(--spring), box-shadow 0.28s ease, background 0.28s ease;
      user-select: none;
    }

    .liquid-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.28) 50%, transparent 80%);
      transform: translateX(-120%);
      transition: transform 0.6s ease;
      pointer-events: none;
    }

    .liquid-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: var(--glass-highlight), 0 12px 28px rgba(36, 107, 253, 0.28);
    }

    .liquid-btn:hover::before {
      transform: translateX(120%);
    }

    .liquid-btn:active {
      transform: scale(0.93);
    }

    .liquid-btn.primary {
      background: linear-gradient(135deg, rgba(36, 107, 253, 0.88), rgba(155, 107, 255, 0.88));
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .liquid-btn.icon-only {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 16px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      animation: fadeSlideUp 0.45s ease both;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--purple), var(--pink));
      display: grid;
      place-items: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 10px 26px rgba(36, 107, 253, 0.38);
      animation: floatPulse 4s ease-in-out infinite;
    }

    .brand-meta h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.15;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 600;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      transition: background 0.3s ease;
    }
    .sync-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .sync-dot.error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Segmented View Tabs (Taskez Overview / Collections / Library) */
    .seg-tabs {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
      margin-bottom: 22px;
    }

    .seg-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.28s var(--spring);
      font-family: inherit;
    }

    .seg-tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 18px rgba(36, 107, 253, 0.45);
      transform: scale(1.02);
    }

    /* Dashboard Bento Grid (Taskez Inspired) */
    .dash-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    @media (max-width: 960px) {
      .dash-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .dash-grid { grid-template-columns: 1fr; }
    }

    /* Priority Progress Hero Card (Taskez signature pastel gradient) */
    .hero-progress-card {
      position: relative;
      border-radius: var(--radius-lg);
      padding: 22px;
      background: linear-gradient(130deg, #8df4ff 0%, #c6a7ff 52%, #ff9be5 100%);
      color: #11131a;
      box-shadow: 0 16px 38px rgba(155, 107, 255, 0.28);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 178px;
      transition: transform 0.3s var(--spring);
      cursor: pointer;
    }

    .hero-progress-card:hover {
      transform: translateY(-4px) scale(1.01);
    }

    .hero-progress-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      top: -65px;
      inset-inline-end: -45px;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      z-index: 1;
    }

    .hero-title { font-size: 19px; font-weight: 800; }
    .hero-sub { font-size: 13px; font-weight: 600; opacity: 0.78; margin-top: 4px; }

    .hero-pill {
      background: rgba(17, 19, 26, 0.14);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .hero-bar-wrap { margin-top: 22px; z-index: 1; }
    .hero-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hero-track {
      height: 10px;
      background: rgba(17, 19, 26, 0.16);
      border-radius: 999px;
      overflow: hidden;
    }
    .hero-fill {
      height: 100%;
      background: #13151b;
      border-radius: 999px;
      transition: width 0.7s var(--spring);
      position: relative;
    }

    /* Dark Glass Stat Cards */
    .bento-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.28s var(--spring), border-color 0.28s ease;
    }
    .bento-card:hover {
      transform: translateY(-3px);
      border-color: rgba(155, 107, 255, 0.42);
    }

    /* Circular Goal Ring Card */
    .ring-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .ring-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.18);
      color: var(--green);
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .ring-svg { width: 88px; height: 88px; transform: rotate(-90deg); flex-shrink: 0; }
    .ring-bg { fill: none; stroke: rgba(148, 163, 184, 0.18); stroke-width: 9; }
    .ring-fg {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s var(--spring);
    }

    /* Mini Bar Chart Card */
    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      height: 92px;
      margin-top: 12px;
    }
    .chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
      cursor: pointer;
    }
    .chart-bar-track {
      width: 12px;
      height: 68px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .chart-bar-fill {
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--purple));
      transition: height 0.7s var(--spring);
    }
    .chart-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      max-width: 54px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Overview Quick Stat Rows (Taskez style) */
    .quick-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-row-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.25s var(--spring), border-color 0.25s ease;
    }
    .stat-row-card:hover {
      transform: translateY(-2px);
      border-color: rgba(36, 107, 253, 0.45);
    }
    .stat-left { display: flex; align-items: center; gap: 12px; }
    .squircle-ico {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }
    .stat-num { font-size: 18px; font-weight: 800; }

    /* Section Headers */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 14px;
      flex-wrap: wrap;
    }
    .section-head h2 {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Collections Grid (Taskez Projects Style) */
    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .col-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      transition: transform 0.28s var(--spring), border-color 0.28s ease, box-shadow 0.28s ease;
      overflow: hidden;
    }
    .col-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
    }
    .col-card.active-col {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(36, 107, 253, 0.35), 0 14px 30px rgba(36, 107, 253, 0.2);
    }
    .col-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .col-info { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .col-title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .col-pill {
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff;
      flex-shrink: 0;
    }
    .col-bar-track {
      height: 6px;
      background: rgba(148, 163, 184, 0.16);
      border-radius: 999px;
      overflow: hidden;
    }
    .col-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s var(--spring);
    }

    /* Controls Bar (Search + Filters + View Mode) */
    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }

    .search-wrap {
      flex: 1;
      min-width: 230px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 107, 253, 0.22);
      transform: scale(1.005);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .fpill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.25s var(--spring);
    }
    .fpill.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(36, 107, 253, 0.35);
    }

    /* Media Cards Grid with Animated Neon Border */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 18px;
    }

    .media-grid.list-view {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @keyframes neonSpin {
      to { --neon-angle: 360deg; }
    }

    .media-card {
      position: relative;
      border-radius: 20px;
      padding: 2px;
      background: var(--border);
      cursor: pointer;
      transition: transform 0.32s var(--spring), box-shadow 0.32s ease;
      animation: fadeSlideUp 0.35s ease both;
    }

    .media-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 2px;
      background: conic-gradient(
        from var(--neon-angle),
        transparent 0deg,
        var(--cyan) 65deg,
        var(--purple) 140deg,
        var(--pink) 215deg,
        transparent 285deg
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: neonSpin 3.2s linear infinite;
      pointer-events: none;
    }

    .media-card:hover,
    .media-card.watched-glow:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 38px rgba(155, 107, 255, 0.26);
    }

    .media-card:hover::before {
      opacity: 1;
    }

    .media-card-inner {
      position: relative;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .media-grid.list-view .media-card-inner {
      flex-direction: row;
      align-items: center;
      padding: 10px;
      gap: 14px;
    }

    .poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(135deg, #1b1f2e, #12141c);
      overflow: hidden;
    }

    .media-grid.list-view .poster-box {
      width: 56px;
      height: 82px;
      aspect-ratio: auto;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease, opacity 0.4s ease;
    }

    .media-card:hover .poster-box img {
      transform: scale(1.06);
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      gap: 8px;
      background: radial-gradient(circle at 30% 20%, rgba(36, 107, 253, 0.28), rgba(155, 107, 255, 0.14), #13151c);
      color: rgba(255, 255, 255, 0.85);
    }
    .poster-fallback .pf-ico { font-size: 30px; }
    .poster-fallback .pf-txt {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badge-type {
      position: absolute;
      top: 9px;
      inset-inline-start: 9px;
      background: rgba(13, 15, 22, 0.72);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .check-fab {
      position: absolute;
      top: 9px;
      inset-inline-end: 9px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(13, 15, 22, 0.65);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      font-weight: 900;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s var(--spring), background 0.25s ease;
      z-index: 2;
    }
    .check-fab:hover { transform: scale(1.14); }
    .media-card.completed .check-fab {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.75);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .media-grid.list-view .card-info {
      padding: 0;
    }

    .m-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      direction: ltr;
      text-align: start;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .m-meta {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .m-prog-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      margin-top: auto;

      height: 100%;

      transition: width 0.35s ease;

    /* Floating Apple Liquid Glass Bottom Dock */
    .liquid-dock {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight), 0 18px 42px rgba(0, 0, 0, 0.45);
      z-index: 90;
    }

    .dock-item {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 19px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.28s var(--spring), color 0.25s ease, background 0.25s ease;
    }
    .dock-item:hover { transform: translateY(-3px) scale(1.08); color: var(--text); }
    .dock-item.active {
      background: rgba(36, 107, 253, 0.22);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(36, 107, 253, 0.45);
    }

    .dock-add {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(36, 107, 253, 0.55);
      transition: transform 0.3s var(--spring);

    .dock-add:active { transform: scale(0.92); }

      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      place-items: center;
      padding: 16px;
      z-index: 200;
      overflow-y: auto;

      border-radius: 17px;

    }

    .detail-content {
      flex: 1;
      display: flex;

      gap: 12px;
      width: 100%;
    }
    .detail-title {

    .ep-box {

    }

    .star-row {

      font-size: 24px;

    }

    }

    .star-row span:hover { transform: scale(1.25); }

    /* Form Fields */
    .form-grid { display: flex; flex-direction: column; gap: 13px; margin-top: 14px; }
    .f-group { display: flex; flex-direction: column; gap: 5px; }
    .f-group label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .f-group input, .f-group select {

    .f-group input:focus, .f-group select:focus {

    .modal-footer {

    }
    @keyframes floatPulse {

  </style>
</head>

    const firebaseConfig = {

    // ================= SOUND ENGINE (Web Audio API) =================
    let soundEnabled = localStorage.getItem("mtx_sound") !== "off";
    let audioCtx = null;

    function playSound(type = "click") {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(620, now);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.055);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.065);
        } else if (type === "success") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.07);
          osc.frequency.setValueAtTime(783.99, now + 0.14);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === "open") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.11);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);

    // ================= I18N (UI ONLY - TITLES STRICTLY ENGLISH) =================

    const i18n = {

    function buildSeedItems() {
      const list = [];
      let idx = 1;
      const pushGroup = (arr, colId) => {
        arr.forEach(([title, type, release, epTotal]) => {
          list.push({
            id: `${colId}_${idx++}`,
            title,
            type,
            collectionId: colId,
            release: release || "",
            epCurrent: 0,
            epTotal: type === "Series" ? (epTotal || 10) : 1,
            rating: 0,
            completed: false,
            poster: ""
          });
        });
      };
      pushGroup(MCU_RAW, "mcu");
      pushGroup(POWER_RAW, "power");
      pushGroup(FAV_MOVIES_RAW, "favorites");

    // ================= OFFICIAL POSTER ENGINE (TVMaze + iTunes HD + Wikipedia) =================
    function cleanSearchTitle(title) {
      return title
        .replace(/\s*Season\s*\d+/i, "")
        .replace(/\*/g, "")
        .trim();
    }

    function fetchItunesJSONP(term, mediaType) {
      return new Promise((resolve) => {
        const cb = "mtxIt_" + Date.now() + "_" + Math.floor(Math.random() * 9999);
        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); resolve(""); }, 4000);
        function cleanup() {
          clearTimeout(timer);
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = (data) => {
          cleanup();
          const res = data?.results?.[0]?.artworkUrl100;
          resolve(res ? res.replace("100x100bb", "600x600bb") : "");
        };
        script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=${mediaType}&limit=3&callback=${cb}`;
        script.onerror = () => { cleanup(); resolve(""); };
        document.body.appendChild(script);
      });
    }

    async function fetchTvMaze(term) {
      try {
        const res = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(term)}`);
        if (!res.ok) return "";
        const data = await res.json();
        return data?.image?.original || data?.image?.medium || "";
      } catch {
        return "";
      }
    }

    async function fetchWikiPoster(term) {
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term.replace(/ /g, "_"))}`);
        if (!res.ok) return "";
        const data = await res.json();
        return data?.originalimage?.source || data?.thumbnail?.source || "";
      } catch {
        return "";
      }
    }

    const inFlightPosters = new Set();

    async function resolvePoster(item) {
      if (item.poster) return item.poster;
      const cacheKey = cleanSearchTitle(item.title).toLowerCase();
      if (posterCache[cacheKey]) return posterCache[cacheKey];
      if (inFlightPosters.has(cacheKey)) return "";

      inFlightPosters.add(cacheKey);
      const q = cleanSearchTitle(item.title);
      let url = "";

      if (item.type === "Series") {
        url = await fetchTvMaze(q);
        if (!url) url = await fetchItunesJSONP(q, "tvShow");
      } else {
        url = await fetchItunesJSONP(q, "movie");
        if (!url) url = await fetchWikiPoster(q + " (film)");
      }
      if (!url) url = await fetchWikiPoster(q);

      inFlightPosters.delete(cacheKey);
      if (url) {
        posterCache[cacheKey] = url;
        localStorage.setItem("mtx_posters_v2", JSON.stringify(posterCache));
        // Update matching DOM posters live without full re-render
        document.querySelectorAll(`[data-poster-key="${CSS.escape(cacheKey)}"]`).forEach(box => {
          box.innerHTML = `<img src="${url}" alt="${item.title}" loading="lazy" />`;
        });
      }
      return url;
    }

    const posterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        posterObserver.unobserve(el);
        const id = el.dataset.itemId;
        const item = items.find(i => i.id === id);
        if (item) resolvePoster(item);
      });
    }, { rootMargin: "220px" });

    // ================= CLOUD SYNC (FIREBASE FIRESTORE) =================
    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");

    function setSyncState(state, textKey) {
      syncDot.className = "sync-dot " + state;
      syncText.textContent = i18n[currentLang][textKey] || textKey;
    }

    async function saveCloud() {
      localStorage.setItem("mtx_cols_v2", JSON.stringify(collections));
      localStorage.setItem("mtx_items_v2", JSON.stringify(items));
      renderAll();
      setSyncState("", "syncing");
      try {
        await setDoc(cloudDocRef, { collections, items, updatedAt: Date.now() });
        setSyncState("online", "synced");
      } catch (e) {
        console.error(e);
        setSyncState("error", "offline");
      }
    }

    let initialSyncDone = false;
    onSnapshot(cloudDocRef, (snap) => {
      if (snap.exists() && Array.isArray(snap.data().items) && snap.data().items.length > 0) {
        collections = snap.data().collections || SEED_COLLECTIONS;
        items = snap.data().items;
        localStorage.setItem("mtx_cols_v2", JSON.stringify(collections));
        localStorage.setItem("mtx_items_v2", JSON.stringify(items));
        renderAll();
      } else if (!initialSyncDone) {
        // First time ever: push all 142 items + 5 collections to Firebase
        saveCloud();
      }
      initialSyncDone = true;
      setSyncState("online", "synced");
    }, (err) => {
      console.error(err);
      setSyncState("error", "offline");
    });

    // ================= RENDERING =================
    function renderStats() {
      const total = items.length;
      const done = items.filter(i => i.completed).length;
      const rem = total - done;
      const pct = total ? Math.round((done / total) * 100) : 0;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statDone").textContent = done;
      document.getElementById("statRemaining").textContent = rem;

      document.getElementById("heroSub").textContent = `${done} / ${total}`;
      document.getElementById("heroPctPill").textContent = `${pct}%`;
      document.getElementById("heroBarPct").textContent = `${pct}%`;
      document.getElementById("heroFill").style.width = `${pct}%`;

      // MCU Ring
      const mcuItems = items.filter(i => i.collectionId === "mcu");
      const mcuDone = mcuItems.filter(i => i.completed).length;
      const mcuPct = mcuItems.length ? Math.round((mcuDone / mcuItems.length) * 100) : 0;
      document.getElementById("ringBadge").textContent = `${mcuPct}%`;
      document.getElementById("mcuSub").textContent = `${mcuDone} / ${mcuItems.length}`;
      const dashOffset = 251.2 - (251.2 * mcuPct) / 100;
      document.getElementById("mcuRingFg").style.strokeDashoffset = dashOffset;

      // Collections Mini Chart
      document.getElementById("totalColsBadge").textContent = collections.length;
      const maxCount = Math.max(1, ...collections.map(c => items.filter(i => i.collectionId === c.id).length));
      const chartBars = document.getElementById("chartBars");
      chartBars.innerHTML = collections.slice(0, 6).map(c => {
        const count = items.filter(i => i.collectionId === c.id).length;
        const h = Math.max(14, Math.round((count / maxCount) * 100));
        return `
          <div class="chart-col" data-chart-col="${c.id}" title="${c.name} (${count})">
            <div class="chart-bar-track">
              <div class="chart-bar-fill" style="height:${h}%;background:${c.color}"></div>
            </div>
            <span class="chart-label">${c.icon}</span>
          </div>
        `;
      }).join("");
    }

    function renderCollections() {
      const grid = document.getElementById("collectionsGrid");
      grid.innerHTML = collections.map(col => {
        const colItems = items.filter(i => i.collectionId === col.id);
        const done = colItems.filter(i => i.completed).length;
        const pct = colItems.length ? Math.round((done / colItems.length) * 100) : 0;
        const isActive = activeCollectionId === col.id;
        return `
          <div class="col-card ${isActive ? "active-col" : ""}" data-col-id="${col.id}">
            <div class="col-top">
              <div class="col-info">
                <div class="squircle-ico" style="background:${col.color}">${col.icon}</div>
                <div style="min-width:0">
                  <div class="col-title" dir="ltr">${col.name}</div>
                  <div class="col-sub">${colItems.length} works • ${pct}%</div>
                </div>
              </div>
              <span class="col-pill" style="background:${col.color}">${done}/${colItems.length}</span>
            </div>
            <div class="col-bar-track">
              <div class="col-bar-fill" style="width:${pct}%;background:${col.color}"></div>
            </div>
          </div>
        `;
      }).join("");

      // Populate select dropdown in Add Modal
      const sel = document.getElementById("inCollection");
      sel.innerHTML = collections.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join("");

    function renderLibrary() {
      const grid = document.getElementById("mediaGrid");
      grid.className = "media-grid" + (isListView ? " list-view" : "");

      const activeCol = collections.find(c => c.id === activeCollectionId);
      document.getElementById("activeCollectionHeading").textContent = activeCol
        ? `${activeCol.icon} ${activeCol.name}`
        : (currentLang === "ar" ? "جميع الأعمال" : "All Media");

      const filtered = items.filter(item => {
        const matchCol = activeCollectionId === "all" || item.collectionId === activeCollectionId;
        const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.release || "").toLowerCase().includes(searchQuery.toLowerCase());
        const matchType =
          activeTypeFilter === "all" ? true :
          activeTypeFilter === "completed" ? item.completed :
          activeTypeFilter === "unwatched" ? !item.completed :
          item.type === activeTypeFilter;
        return matchCol && matchSearch && matchType;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state">No matching works found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((item, idx) => {
        const cacheKey = cleanSearchTitle(item.title).toLowerCase();
        const posterUrl = item.poster || posterCache[cacheKey] || "";
        const pct = item.type === "Series"
          ? Math.min(100, Math.round(((item.epCurrent || 0) / (item.epTotal || 1)) * 100))
          : (item.completed ? 100 : 0);

        return `
          <article class="media-card ${item.completed ? "completed" : ""}" data-card-id="${item.id}" style="animation-delay:${Math.min(idx * 18, 260)}ms">
            <div class="media-card-inner">
              <div class="poster-box">
                <div class="poster-slot" data-item-id="${item.id}" data-poster-key="${cacheKey}" style="width:100%;height:100%">
                  ${posterUrl
                    ? `<img src="${posterUrl}" alt="${item.title}" loading="lazy" />`
                    : `<div class="poster-fallback"><span class="pf-ico">${item.type === "Series" ? "📺" : "🎬"}</span><span class="pf-txt">${item.title}</span></div>`
                  }
                </div>
                ${!isListView ? `<span class="badge-type">${item.type}</span>` : ""}
                <button class="check-fab" data-quick-toggle="${item.id}" title="Toggle Watched">✓</button>
              </div>
              <div class="card-info">
                <div class="m-title">${item.title}</div>
                <div class="m-meta">
                  <span>${item.release || item.type}</span>
                  <span>${item.rating ? "★".repeat(item.rating) : (item.type === "Series" ? `${item.epCurrent || 0}/${item.epTotal}` : "")}</span>
                </div>
                <div class="m-prog-track"><div class="m-prog-fill" style="width:${pct}%"></div></div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      // Observe missing posters for lazy official fetch
      grid.querySelectorAll(".poster-slot").forEach(slot => {
        if (!slot.querySelector("img")) posterObserver.observe(slot);
      });
    }

    function updateViewVisibility() {
      document.getElementById("dashboardSection").style.display = activeView === "dashboard" ? "block" : "none";
      document.getElementById("collectionsSection").style.display = (activeView === "dashboard" || activeView === "collections") ? "block" : "none";
      document.getElementById("librarySection").style.display = "block";

      document.querySelectorAll(".seg-tab").forEach(t => t.classList.toggle("active", t.dataset.view === activeView));
      document.querySelectorAll(".dock-item[data-dock]").forEach(d => d.classList.toggle("active", d.dataset.dock === activeView));
    }

    function renderAll() {
      renderStats();
      renderCollections();
      renderLibrary();
      updateViewVisibility();
    }

    // ================= DETAIL MODAL =================
    function openDetailModal(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      activeDetailId = id;
      playSound("open");

      const cacheKey = cleanSearchTitle(item.title).toLowerCase();
      const posterUrl = item.poster || posterCache[cacheKey] || "";
      const col = collections.find(c => c.id === item.collectionId);

      document.getElementById("detailPosterWrap").innerHTML = posterUrl
        ? `<img src="${posterUrl}" alt="${item.title}" />`
        : `<div class="poster-fallback"><span class="pf-ico">🎬</span><span class="pf-txt">${item.title}</span></div>`;

      document.getElementById("detailTitle").textContent = item.title;
      document.getElementById("detailTags").innerHTML = `
        <span class="d-tag">${item.type}</span>
        ${item.release ? `<span class="d-tag">${item.release}</span>` : ""}
        ${col ? `<span class="d-tag">${col.icon} ${col.name}</span>` : ""}
      `;

      // Stars
      const starsEl = document.getElementById("detailStars");
      starsEl.innerHTML = [1, 2, 3, 4, 5].map(n =>
        `<span data-star="${n}" class="${n <= (item.rating || 0) ? "lit" : ""}">★</span>`
      ).join("");

      // Episodes
      const epBox = document.getElementById("detailEpBox");
      if (item.type === "Series") {
        epBox.style.display = "flex";
        document.getElementById("detailEpLabel").textContent = `Episode ${item.epCurrent || 0} / ${item.epTotal || 10}`;
      } else {
        epBox.style.display = "none";
      }

      document.getElementById("detailPosterInput").value = item.poster || "";
      document.getElementById("detailToggleBtn").textContent = item.completed ? "✓ Completed" : "Mark Watched";
      document.getElementById("detailModal").classList.add("open");
    }

    // ================= EVENT LISTENERS =================
    // Theme Toggle
    const savedTheme = localStorage.getItem("mtx_theme") || "dark";
    document.documentElement.dataset.theme = savedTheme;
    document.getElementById("themeBtn").textContent = savedTheme === "dark" ? "🌙" : "☀️";
    document.getElementById("themeBtn").onclick = () => {
      playSound("click");
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("mtx_theme", next);
      document.getElementById("themeBtn").textContent = next === "dark" ? "🌙" : "☀️";
    };

    // Sound Toggle
    document.getElementById("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
    document.getElementById("soundBtn").onclick = () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem("mtx_sound", soundEnabled ? "on" : "off");
      document.getElementById("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) playSound("success");
    };

    // Language Toggle
    document.getElementById("langBtn").onclick = () => {
      playSound("click");
      currentLang = currentLang === "ar" ? "en" : "ar";
      localStorage.setItem("mtx_lang", currentLang);
      applyLanguage();
      renderAll();
    };

    // Segmented Tabs & Dock Navigation
    document.querySelectorAll(".seg-tab").forEach(btn => {
      btn.onclick = () => {
        playSound("click");
        activeView = btn.dataset.view;
        updateViewVisibility();
      };
    });

    document.querySelectorAll(".dock-item[data-dock]").forEach(btn => {
      btn.onclick = () => {
        playSound("click");
        activeView = btn.dataset.dock;
        updateViewVisibility();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    });

    document.getElementById("dockSearchBtn").onclick = () => {
      playSound("click");
      activeView = "library";
      updateViewVisibility();
      const inp = document.getElementById("searchInput");
      inp.focus();
      inp.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    // Quick Stat Rows & Hero Card & MCU Button
    document.querySelectorAll(".stat-row-card").forEach(card => {
      card.onclick = () => {
        playSound("click");
        activeTypeFilter = card.dataset.quickFilter;
        activeCollectionId = "all";
        document.querySelectorAll(".fpill").forEach(p => p.classList.toggle("active", p.dataset.type === activeTypeFilter));
        renderAll();
        document.getElementById("librarySection").scrollIntoView({ behavior: "smooth" });
      };
    });

    document.getElementById("openMcuBtn").onclick = () => {
      playSound("click");
      activeCollectionId = "mcu";
      renderAll();
      document.getElementById("librarySection").scrollIntoView({ behavior: "smooth" });
    };

    document.getElementById("showAllColsBtn").onclick = () => {
      playSound("click");
      activeCollectionId = "all";
      renderAll();
    };

    // Collection Card Click & Chart Click
    document.getElementById("collectionsGrid").addEventListener("click", (e) => {
      const card = e.target.closest(".col-card");
      if (!card) return;
      playSound("click");
      const cid = card.dataset.colId;
      activeCollectionId = activeCollectionId === cid ? "all" : cid;
      renderAll();
      document.getElementById("librarySection").scrollIntoView({ behavior: "smooth" });
    });

    document.getElementById("chartBars").addEventListener("click", (e) => {
      const col = e.target.closest("[data-chart-col]");
      if (!col) return;
      playSound("click");
      activeCollectionId = col.dataset.chartCol;
      renderAll();
      document.getElementById("librarySection").scrollIntoView({ behavior: "smooth" });
    });

    // Type Filters & Search & View Mode
    document.getElementById("typeFilters").addEventListener("click", (e) => {
      const pill = e.target.closest(".fpill");
      if (!pill) return;
      playSound("click");
      document.querySelectorAll(".fpill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      activeTypeFilter = pill.dataset.type;
      renderLibrary();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderLibrary();
    });

    document.getElementById("viewToggleBtn").onclick = () => {
      playSound("click");
      isListView = !isListView;
      document.getElementById("viewToggleBtn").textContent = isListView ? "☰" : "⊞";
      renderLibrary();
    };

    // Media Grid Interactions (Quick Check or Open Detail)
    document.getElementById("mediaGrid").addEventListener("click", (e) => {
      const toggleBtn = e.target.closest("[data-quick-toggle]");
      if (toggleBtn) {
        e.stopPropagation();
        const item = items.find(i => i.id === toggleBtn.dataset.quickToggle);
        if (!item) return;
        item.completed = !item.completed;
        if (item.completed && item.type === "Series") item.epCurrent = item.epTotal;
        playSound(item.completed ? "success" : "click");
        saveCloud();
        return;
      }
      const card = e.target.closest(".media-card");
      if (card) openDetailModal(card.dataset.cardId);
    });

    // Detail Modal Actions
    document.getElementById("closeDetailBtn").onclick = () => {
      playSound("click");
      document.getElementById("detailModal").classList.remove("open");
    };
    document.getElementById("detailModal").onclick = (e) => {
      if (e.target.id === "detailModal") document.getElementById("detailModal").classList.remove("open");
    };

    document.getElementById("detailStars").addEventListener("click", (e) => {
      const s = e.target.closest("[data-star]");
      if (!s || !activeDetailId) return;
      const item = items.find(i => i.id === activeDetailId);
      if (!item) return;
      item.rating = Number(s.dataset.star);
      playSound("success");
      saveCloud();
      openDetailModal(activeDetailId);
    });

    document.getElementById("epPlusBtn").onclick = () => {
      const item = items.find(i => i.id === activeDetailId);
      if (!item) return;
      item.epCurrent = Math.min(item.epTotal || 999, (item.epCurrent || 0) + 1);
      if (item.epCurrent >= item.epTotal) item.completed = true;
      playSound("click");
      saveCloud();
      openDetailModal(activeDetailId);
    };

    document.getElementById("epMinusBtn").onclick = () => {
      const item = items.find(i => i.id === activeDetailId);
      if (!item) return;
      item.epCurrent = Math.max(0, (item.epCurrent || 0) - 1);
      if (item.epCurrent < item.epTotal) item.completed = false;
      playSound("click");
      saveCloud();
      openDetailModal(activeDetailId);
    };

    document.getElementById("detailToggleBtn").onclick = () => {
      const item = items.find(i => i.id === activeDetailId);
      if (!item) return;
      item.completed = !item.completed;
      if (item.completed && item.type === "Series") item.epCurrent = item.epTotal;
      playSound(item.completed ? "success" : "click");
      saveCloud();
      openDetailModal(activeDetailId);
    };

    document.getElementById("updatePosterBtn").onclick = () => {
      const item = items.find(i => i.id === activeDetailId);
      if (!item) return;
      item.poster = document.getElementById("detailPosterInput").value.trim();
      playSound("success");
      saveCloud();
      openDetailModal(activeDetailId);
    };

    document.getElementById("detailDeleteBtn").onclick = () => {
      const idx = items.findIndex(i => i.id === activeDetailId);
      if (idx === -1) return;
      if (!confirm(`Delete "${items[idx].title}"?`)) return;
      items.splice(idx, 1);
      playSound("click");
      document.getElementById("detailModal").classList.remove("open");
      saveCloud();
    };

    // Add Media Modal
    const openAddItem = () => {
      playSound("open");
      if (activeCollectionId !== "all") document.getElementById("inCollection").value = activeCollectionId;
      document.getElementById("addItemModal").classList.add("open");
    };
    document.getElementById("newItemBtn").onclick = openAddItem;
    document.getElementById("dockAddBtn").onclick = openAddItem;
    document.getElementById("cancelItemBtn").onclick = () => {
      playSound("click");
      document.getElementById("addItemModal").classList.remove("open");
    };

    document.getElementById("saveItemBtn").onclick = () => {
      const title = document.getElementById("inTitle").value.trim();
      if (!title) return alert("Please enter an English title.");
      const type = document.getElementById("inType").value;
      items.unshift({
        id: "m_" + Date.now(),
        title,
        type,
        collectionId: document.getElementById("inCollection").value || "movies",
        release: document.getElementById("inRelease").value.trim(),
        epCurrent: 0,
        epTotal: type === "Series" ? (Number(document.getElementById("inTotalEp").value) || 10) : 1,
        rating: 0,
        completed: false,
        poster: document.getElementById("inPoster").value.trim()
      });
      document.getElementById("inTitle").value = "";
      document.getElementById("inRelease").value = "";
      document.getElementById("inPoster").value = "";
      document.getElementById("addItemModal").classList.remove("open");
      playSound("success");
      saveCloud();
    };

    // Add Collection Modal
    document.getElementById("newColBtn").onclick = () => {
      playSound("open");
      document.getElementById("addColModal").classList.add("open");
    };
    document.getElementById("cancelColBtn").onclick = () => {
      playSound("click");
      document.getElementById("addColModal").classList.remove("open");
    };
    document.getElementById("saveColBtn").onclick = () => {
      const name = document.getElementById("colName").value.trim();
      if (!name) return alert("Please enter a collection name.");
      const id = "col_" + Date.now();
      collections.push({
        id,
        name,
        icon: document.getElementById("colIcon").value.trim() || "🎬",
        color: document.getElementById("colColor").value || "#9b6bff"
      });
      document.getElementById("colName").value = "";
      document.getElementById("addColModal").classList.remove("open");
      playSound("success");
      saveCloud();
    };

    // Boot
    applyLanguage();
    renderAll();
  </script>
</body>
</html>
