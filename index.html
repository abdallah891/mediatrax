<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Media TraX</title>

  <!-- PWA & Apple Native-Like Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Media TraX" />
  <meta name="theme-color" content="#0b0d14" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b0d14'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='190,140 380,256 190,372' fill='url(%23g)'/%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #0b0d14;
      --surface: #141824;
      --surface-2: #1c2233;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-2: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom)) 16px;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.14), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.12), transparent 40%);
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
    .sync-badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }
    .sync-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .sync-dot.error { background: var(--danger); }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 800; }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
    }
    .search-box:focus { border-color: var(--accent); outline: none; }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      background: transparent;
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--surface-2);
      color: #fff;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(99, 102, 241, 0.45); transform: translateY(-2px); }
    .card.completed { border-color: rgba(16, 185, 129, 0.4); }

    .poster-wrap {
      position: relative;
      height: 180px;
      background: linear-gradient(135deg, #1a1f33, #101320);
      overflow: hidden;
    }
    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .poster-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.15);
    }

    .type-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(11, 13, 20, 0.8);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .status-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(11, 13, 20, 0.8);
      backdrop-filter: blur(8px);
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 16px;
      display: grid;
      place-items: center;
    }
    .card.completed .status-btn {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .card-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }

    .ep-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      padding: 8px 10px;
      border-radius: 12px;
      gap: 8px;
    }
    .ep-controls { display: flex; gap: 6px; align-items: center; }
    .ep-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      border: 1px solid var(--border);
    }
    .ep-btn:hover { background: var(--accent); }

    .progress-track {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .stars { color: var(--warning); font-size: 14px; letter-spacing: 1px; cursor: pointer; }
    .del-btn {
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .del-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      place-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: grid; }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h2 { font-size: 19px; font-weight: 800; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .field input, .field select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); outline: none; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">▶</div>
        <div>
          <h1>Media TraX</h1>
          <div class="sync-badge">
            <span id="syncDot" class="sync-dot"></span>
            <span id="syncText">جاري الاتصال بـ Firebase...</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn-ghost" id="exportBtn" title="نسخ احتياطي">تصدير</button>
        <button class="btn-primary" id="openModalBtn">+ إضافة عمل</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-label">الإجمالي</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">مكتمل ✓</div>
        <div class="stat-value" id="statDone" style="color: var(--success)">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">قيد المشاهدة</div>
        <div class="stat-value" id="statWatching" style="color: var(--accent)">0</div>
      </div>
    </section>

    <section class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن فيلم، مسلسل، أو أنمي..." />
      <div class="tabs" id="filterTabs">
        <button class="tab active" data-filter="all">الكل</button>
        <button class="tab" data-filter="movie">أفلام</button>
        <button class="tab" data-filter="series">مسلسلات</button>
        <button class="tab" data-filter="anime">أنمي</button>
        <button class="tab" data-filter="completed">مكتمل</button>
      </div>
    </section>

    <main class="grid" id="mediaGrid"></main>
  </div>

  <!-- Add Media Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2>إضافة عمل جديد</h2>
      <div class="field">
        <label>الاسم (يفضل بالإنجليزية لجلب البوستر تلقائياً)</label>
        <input type="text" id="mTitle" placeholder="مثال: Inception أو Breaking Bad" />
      </div>
      <div class="row-2">
        <div class="field">
          <label>النوع</label>
          <select id="mType">
            <option value="movie">فيلم</option>
            <option value="series">مسلسل</option>
            <option value="anime">أنمي</option>
          </select>
        </div>
        <div class="field">
          <label>التقييم (1 - 5)</label>
          <input type="number" id="mRating" min="1" max="5" value="5" />
        </div>
      </div>
      <div class="row-2" id="episodesRow" style="display:none;">
        <div class="field">
          <label>الحلقة الحالية</label>
          <input type="number" id="mEpCurrent" min="0" value="0" />
        </div>
        <div class="field">
          <label>إجمالي الحلقات</label>
          <input type="number" id="mEpTotal" min="1" value="12" />
        </div>
      </div>
      <div class="field">
        <label>رابط البوستر (اختياري — يُجلب تلقائياً إذا تُرك فارغاً)</label>
        <input type="url" id="mPoster" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="closeModalBtn">إلغاء</button>
        <button class="btn-primary" id="saveMediaBtn">حفظ ومزامنة</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDu87lWveNLRGcGIapKKd0e07WsjtjyA8E",
      authDomain: "mediatrax-9ee18.firebaseapp.com",
      projectId: "mediatrax-9ee18",
      storageBucket: "mediatrax-9ee18.firebasestorage.app",
      messagingSenderId: "637978360302",
      appId: "1:637978360302:web:3eed37b8fcbc0149beb6ff"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const userDocRef = doc(db, "mediatrax", "main_library");

    let items = JSON.parse(localStorage.getItem("mediatrax_cache") || "[]");
    let currentFilter = "all";
    let searchQuery = "";

    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");
    const grid = document.getElementById("mediaGrid");

    function setSyncStatus(state, text) {
      syncDot.className = "sync-dot " + state;
      syncText.textContent = text;
    }

    // Real-time Firestore listener
    onSnapshot(userDocRef, (snap) => {
      if (snap.exists() && Array.isArray(snap.data().items)) {
        items = snap.data().items;
        localStorage.setItem("mediatrax_cache", JSON.stringify(items));
        render();
      }
      setSyncStatus("online", "متزامن سحابياً");
    }, (err) => {
      console.error(err);
      setSyncStatus("error", "تعذر الاتصال (وضع محلي)");
    });

    async function saveToCloud() {
      localStorage.setItem("mediatrax_cache", JSON.stringify(items));
      render();
      setSyncStatus("", "جاري المزامنة...");
      try {
        await setDoc(userDocRef, { items, updatedAt: Date.now() });
        setSyncStatus("online", "متزامن سحابياً");
      } catch (err) {
        console.error(err);
        setSyncStatus("error", "خطأ في الحفظ السحابي");
      }
    }

    // Fetch Poster via iTunes JSONP (No CORS issues)
    function fetchPosterJSONP(title, type) {
      return new Promise((resolve) => {
        const cbName = "itCb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        const media = type === "movie" ? "movie" : "tvShow";
        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); resolve(""); }, 3500);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          cleanup();
          const art = data?.results?.[0]?.artworkUrl100;
          resolve(art ? art.replace("100x100bb", "600x600bb") : "");
        };

        script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(title)}&media=${media}&limit=1&callback=${cbName}`;
        script.onerror = () => { cleanup(); resolve(""); };
        document.body.appendChild(script);
      });
    }

    function typeLabel(t) {
      return t === "movie" ? "فيلم" : t === "series" ? "مسلسل" : "أنمي";
    }

    function render() {
      document.getElementById("statTotal").textContent = items.length;
      const doneCount = items.filter(i => i.completed).length;
      document.getElementById("statDone").textContent = doneCount;
      document.getElementById("statWatching").textContent = items.length - doneCount;

      const filtered = items.filter(item => {
        const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchFilter =
          currentFilter === "all" ? true :
          currentFilter === "completed" ? item.completed :
          item.type === currentFilter;
        return matchSearch && matchFilter;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">لا توجد أعمال هنا بعد. اضغط على <strong>+ إضافة عمل</strong> للبدء.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const pct = item.type === "movie"
          ? (item.completed ? 100 : 0)
          : Math.min(100, Math.round(((item.epCurrent || 0) / (item.epTotal || 1)) * 100));

        return `
          <article class="card ${item.completed ? "completed" : ""}">
            <div class="poster-wrap">
              ${item.poster
                ? `<img src="${item.poster}" alt="${item.title}" loading="lazy" />`
                : `<div class="poster-placeholder">🎬</div>`}
              <span class="type-pill">${typeLabel(item.type)}</span>
              <button class="status-btn" data-action="toggle" data-id="${item.id}" title="تبديل الحالة">✓</button>
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              ${item.type !== "movie" ? `
                <div class="ep-bar">
                  <span style="font-size:12px;color:var(--muted)">الحلقة <strong>${item.epCurrent || 0}</strong> / ${item.epTotal || 1}</span>
                  <div class="ep-controls">
                    <button class="ep-btn" data-action="ep-minus" data-id="${item.id}">−</button>
                    <button class="ep-btn" data-action="ep-plus" data-id="${item.id}">+</button>
                  </div>
                </div>
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              ` : ""}
              <div class="card-footer">
                <span class="stars" data-action="rate" data-id="${item.id}" title="اضغط لتغيير التقييم">${"★".repeat(item.rating || 5)}${"☆".repeat(5 - (item.rating || 5))}</span>
                <button class="del-btn" data-action="delete" data-id="${item.id}">حذف</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    // Event delegation for cards
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const idx = items.findIndex(i => i.id === id);
      if (idx === -1) return;

      if (action === "toggle") {
        items[idx].completed = !items[idx].completed;
      } else if (action === "ep-plus") {
        items[idx].epCurrent = Math.min((items[idx].epTotal || 999), (items[idx].epCurrent || 0) + 1);
        if (items[idx].epCurrent >= items[idx].epTotal) items[idx].completed = true;
      } else if (action === "ep-minus") {
        items[idx].epCurrent = Math.max(0, (items[idx].epCurrent || 0) - 1);
        if (items[idx].epCurrent < items[idx].epTotal) items[idx].completed = false;
      } else if (action === "rate") {
        items[idx].rating = (items[idx].rating || 5) >= 5 ? 1 : items[idx].rating + 1;
      } else if (action === "delete") {
        if (!confirm(`حذف "${items[idx].title}"؟`)) return;
        items.splice(idx, 1);
      }
      saveToCloud();
    });

    // Filters & Search
    document.getElementById("filterTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentFilter = tab.dataset.filter;
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Modal
    const backdrop = document.getElementById("modalBackdrop");
    const mType = document.getElementById("mType");
    const episodesRow = document.getElementById("episodesRow");

    mType.addEventListener("change", () => {
      episodesRow.style.display = mType.value === "movie" ? "none" : "grid";
    });

    document.getElementById("openModalBtn").onclick = () => backdrop.classList.add("open");
    document.getElementById("closeModalBtn").onclick = () => backdrop.classList.remove("open");
    backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.classList.remove("open"); };

    document.getElementById("saveMediaBtn").onclick = async () => {
      const title = document.getElementById("mTitle").value.trim();
      if (!title) return alert("اكتب اسم العمل أولاً");

      const saveBtn = document.getElementById("saveMediaBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "جاري الحفظ...";

      const type = mType.value;
      let poster = document.getElementById("mPoster").value.trim();
      if (!poster) poster = await fetchPosterJSONP(title, type);

      items.unshift({
        id: "m_" + Date.now(),
        title,
        type,
        rating: Math.min(5, Math.max(1, Number(document.getElementById("mRating").value) || 5)),
        epCurrent: type === "movie" ? 0 : (Number(document.getElementById("mEpCurrent").value) || 0),
        epTotal: type === "movie" ? 1 : (Number(document.getElementById("mEpTotal").value) || 12),
        poster,
        completed: false
      });

      document.getElementById("mTitle").value = "";
      document.getElementById("mPoster").value = "";
      saveBtn.disabled = false;
      saveBtn.textContent = "حفظ ومزامنة";
      backdrop.classList.remove("open");
      saveToCloud();
    };

    // Export Backup
    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "mediatrax-backup.json";
      a.click();
    };

    render();
  </script>
</body>
</html>
